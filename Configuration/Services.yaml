services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Caretaker\Caretaker\Controller\:
    resource: '../Classes/Controller/*'
    exclude: '../Classes/Domain/Model/*'

  Caretaker\Caretaker\Command\RunTestCommand:
    tags:
      - name: console.command
        command: 'caretaker:runtest'
        description: 'This command runs tests for a given node id.'
